{# Formes UCIV d'un hero ({% formes_hero 'cle' %}) : un calque à la taille de la maquette, centré, derrière le contenu. #}
<span class="formes-uciv formes-uciv--desktop" aria-hidden="true">{% for style in desktop %}<span class="forme-uciv" style="{{ style }}"></span>{% endfor %}</span>
<span class="formes-uciv formes-uciv--mobile" aria-hidden="true">{% for style in mobile %}<span class="forme-uciv" style="{{ style }}"></span>{% endfor %}</span>
