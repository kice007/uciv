# Nginx : site UCIV (copié dans /etc/nginx/sites-available/uciv par deploy/deployer.sh).
# `server_name` est complété par le script (www.uciv.org seulement si le DNS existe).
# Le certificat HTTPS est ajouté ensuite par certbot, qui modifie ce fichier.
server {
    listen 80;
    listen [::]:80;
    server_name __NOMS_DU_SITE__;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Fichiers statiques (collectstatic) et médias téléversés depuis l'administration
    location /static/ {
        alias /srv/uciv/src/static_cdn/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /srv/uciv/src/media_cdn/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Le reste est servi par Django (Gunicorn)
    location / {
        proxy_pass http://unix:/run/uciv/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
